name: Build documentation

on:
  push:
    branches:
      - main
      - doc-builder*
      - v*-release

jobs:
   build:
    uses: huggingface/doc-builder/.github/workflows/build_main_documentation.yml@d2a7889cfaa63d1743f36d8a038f3139b3c90656  # main
    with:
      commit_sha: ${{ github.sha }}
      package: huggingface_hub
      languages: cn de fr en hi ko or ta
    secrets:
      hf_token: ${{ secrets.HF_DOC_BUILD_PUSH }}
